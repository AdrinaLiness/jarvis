<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.A.R.V.I.S.</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--c:#38e8ff;--c2:#9df6ff;--dim:rgba(56,232,255,.28);--dim2:rgba(56,232,255,.12);--panel:rgba(6,26,38,.45);--ok:#42ffb0;--warn:#ffb347;--bad:#ff5c6c}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 42%,#0b3346 0%,#04141f 45%,#01070b 100%);font-family:'Share Tech Mono',Consolas,monospace;color:var(--c);overflow:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1;background-image:linear-gradient(rgba(56,232,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,232,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 45%,#000 10%,transparent 78%);-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 10%,transparent 78%)}
body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(180deg,rgba(56,232,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:screen;opacity:.5}
#boot{position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:#01070b;display:flex;align-items:center;justify-content:center;transition:opacity .9s,visibility .9s}
#boot.hide{opacity:0;visibility:hidden}
#bootlog{width:680px;max-width:86vw;font-size:15px;line-height:1.9;text-shadow:0 0 12px rgba(56,232,255,.65);color:var(--c2)}
.bootline::before{content:'> ';color:var(--dim)}
.bootline{white-space:pre-wrap;min-height:1.9em}
.cursor{display:inline-block;width:9px;height:1.05em;background:var(--c);vertical-align:-2px;animation:blink .8s steps(1) infinite;box-shadow:0 0 10px var(--c)}
@keyframes blink{50%{opacity:0}}
#app{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;display:grid;grid-template-rows:auto 1fr auto;opacity:0;transition:opacity 1.1s}
#app.on{opacity:1}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;border-bottom:1px solid var(--dim);background:linear-gradient(180deg,rgba(6,26,38,.75),transparent)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-family:'Orbitron',sans-serif;font-weight:900;letter-spacing:.32em;font-size:22px;text-shadow:0 0 18px rgba(56,232,255,.8),0 0 46px rgba(56,232,255,.35)}
.brand small{color:var(--dim);letter-spacing:.18em;font-size:10px}
.hdr-right{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.1em}
.clock{font-family:'Orbitron',sans-serif;font-size:17px;color:var(--c2);text-shadow:0 0 14px rgba(56,232,255,.7)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 10px var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
main{display:grid;grid-template-columns:310px 1fr 320px;gap:14px;padding:14px;min-height:0}
.panel{position:relative;background:var(--panel);border:1px solid var(--dim);backdrop-filter:blur(6px);padding:14px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--dim) transparent}
.panel::-webkit-scrollbar{width:5px}.panel::-webkit-scrollbar-thumb{background:var(--dim)}
.panel::before,.panel::after{content:'';position:absolute;width:14px;height:14px;border:2px solid var(--c);opacity:.75;pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.panel h2{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.24em;color:var(--c2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--dim2);display:flex;justify-content:space-between}
.panel h2 span{color:var(--dim);font-size:9.5px}
.metric{margin-bottom:12px}
.metric .row{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.09em;margin-bottom:5px}
.metric .row b{color:var(--c2);font-weight:400;font-family:'Orbitron',sans-serif;font-size:10.5px}
.bar{height:4px;background:rgba(56,232,255,.1);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1a7f9c,var(--c));box-shadow:0 0 10px var(--c);transition:width .5s}
.tgroup{margin-bottom:14px}
.tgroup-title{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.28em;color:var(--c2);opacity:.75;margin-bottom:6px;padding-bottom:3px;border-bottom:1px dashed var(--dim2)}
.tele{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:11.5px}
.tele .k{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tele .v{color:var(--c2);text-align:right;font-family:'Orbitron',sans-serif;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.tele .v.warn{color:var(--warn)}.tele .v.bad{color:var(--bad)}.tele .v.ok{color:var(--ok)}
.center{display:flex;flex-direction:column;min-height:0;position:relative}
.reactor-wrap{flex:1;position:relative;min-height:0}
#reactor{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
#state{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.4em;color:var(--c2);text-shadow:0 0 16px var(--c);padding:6px 18px;border:1px solid var(--dim2);background:rgba(2,12,18,.5);white-space:nowrap}
.wave{height:86px;position:relative;border-top:1px solid var(--dim2)}
#wave{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;display:block}
#log{display:flex;flex-direction:column;gap:10px;font-size:12.5px;line-height:1.5}
.msg{padding-left:11px;border-left:2px solid var(--dim);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(-8px)}}
.msg .who{font-size:9.5px;letter-spacing:.22em;color:var(--dim);display:block;margin-bottom:2px}
.msg.user{border-left-color:var(--warn)}.msg.user .txt{color:#ffd9a0}
.msg.jarvis{border-left-color:var(--c)}.msg.jarvis .txt{color:var(--c2);text-shadow:0 0 12px rgba(56,232,255,.35)}
.msg.sys{border-left-color:#5a7f90}.msg.sys .txt{color:#7fa8bb;white-space:pre-wrap;font-size:11.5px}
footer{border-top:1px solid var(--dim);padding:12px 22px 16px;background:linear-gradient(0deg,rgba(6,26,38,.8),transparent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:10.5px;letter-spacing:.1em;padding:5px 11px;cursor:pointer;border:1px solid var(--dim);color:var(--dim);background:transparent;transition:.22s;font-family:inherit}
.chip:hover{color:#02141d;background:var(--c);border-color:var(--c);box-shadow:0 0 18px rgba(56,232,255,.6)}
.chip.hot{color:var(--c2);border-color:var(--c);box-shadow:0 0 10px rgba(56,232,255,.3)}
.inputrow{display:flex;gap:10px;align-items:center}
#cmd{flex:1;background:rgba(2,14,20,.7);border:1px solid var(--dim);color:var(--c2);padding:11px 15px;font-family:inherit;font-size:13.5px;outline:none}
#cmd:focus{border-color:var(--c);box-shadow:0 0 22px rgba(56,232,255,.28) inset,0 0 12px rgba(56,232,255,.18)}
#cmd::placeholder{color:rgba(56,232,255,.32)}
.btn{width:46px;height:44px;display:grid;place-items:center;cursor:pointer;background:rgba(2,14,20,.7);border:1px solid var(--dim);color:var(--c);transition:.22s;flex:none}
.btn:hover{border-color:var(--c);box-shadow:0 0 18px rgba(56,232,255,.4)}
.btn svg{width:19px;height:19px;fill:currentColor}
.btn.active{background:var(--c);color:#02141d;border-color:var(--c)}
.btn.off{color:#3d5f6e;border-color:rgba(56,232,255,.14)}
#send,#paletteBtn{width:auto;padding:0 16px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:.2em}
.palette{position:fixed;top:0;left:0;right:0;bottom:0;z-index:150;background:rgba(1,7,11,.85);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 4vw;opacity:0;visibility:hidden;transition:.25s}
.palette.on{opacity:1;visibility:visible}
.palette-box{width:1100px;max-width:100%;max-height:88vh;background:rgba(4,20,30,.96);border:1px solid var(--c);box-shadow:0 0 60px rgba(56,232,255,.35);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}
.palette-head{display:flex;gap:12px;padding:16px 20px;border-bottom:1px solid var(--dim);align-items:center}
#paletteSearch{flex:1;background:transparent;border:none;outline:none;color:var(--c2);font-family:inherit;font-size:16px;padding:8px 4px}
#paletteSearch::placeholder{color:rgba(56,232,255,.35)}
.palette-count{font-size:11px;color:var(--dim);letter-spacing:.15em}
.palette-body{display:grid;grid-template-columns:220px 1fr;min-height:0}
#paletteCats{border-right:1px solid var(--dim);padding:14px;overflow-y:auto}
.cat{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:11.5px;color:var(--dim);cursor:pointer;border-left:2px solid transparent;transition:.15s}
.cat:hover{color:var(--c2)}
.cat.on{color:var(--c2);border-left-color:var(--c);background:rgba(56,232,255,.06)}
.cat span{font-size:10px;opacity:.6}
#paletteList{overflow-y:auto;padding:10px}
.cmd-item{padding:10px 14px;border:1px solid transparent;cursor:pointer;margin-bottom:4px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;transition:.12s}
.cmd-item:hover,.cmd-item.sel{border-color:var(--c);background:rgba(56,232,255,.08)}
.cmd-item .ci-name{font-size:13px;color:var(--c2);margin-bottom:2px}
.cmd-item .ci-desc{font-size:11px;color:var(--dim)}
.cmd-item .ci-cat{font-size:10px;color:var(--dim);border:1px solid var(--dim);padding:3px 8px}
.palette-foot{padding:10px 20px;border-top:1px solid var(--dim);font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
@media(max-width:1020px){main{grid-template-columns:1fr}.left{display:none}.right{max-height:190px}.reactor-wrap{min-height:290px}.palette-body{grid-template-columns:1fr}#paletteCats{display:none}}
/* ===== JARVIS: ИИ-МОДУЛЬ ===== */
.jarvis-ai-chip{border-color:#7c5cff!important;color:#b9a8ff!important;box-shadow:0 0 12px rgba(124,92,255,.35)}
#jarvisSettings{position:fixed;inset:0;z-index:300;background:rgba(1,7,11,.88);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:.22s}
#jarvisSettings.on{opacity:1;visibility:visible}
.js-box{width:640px;max-width:94vw;max-height:88vh;overflow:auto;background:rgba(4,20,30,.97);border:1px solid #7c5cff;box-shadow:0 0 60px rgba(124,92,255,.35);padding:22px}
.js-box h3{font-family:'Orbitron',sans-serif;font-size:14px;letter-spacing:.22em;margin-bottom:4px;color:#cfc4ff}
.js-box p.sub{font-size:11px;color:var(--dim);margin-bottom:16px;letter-spacing:.08em}
.js-row{margin-bottom:12px}
.js-row label{display:block;font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:5px}
.js-row input,.js-row textarea,.js-row select{width:100%;background:rgba(2,14,20,.75);border:1px solid var(--dim);color:var(--c2);padding:9px 11px;font-family:inherit;font-size:13px;outline:none}
.js-row input:focus,.js-row textarea:focus{border-color:#7c5cff;box-shadow:0 0 16px rgba(124,92,255,.25)}
.js-row textarea{min-height:96px;resize:vertical;font-size:12px;line-height:1.5}
.js-actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;align-items:center}
.js-btn{padding:9px 16px;font-size:10.5px;letter-spacing:.18em;font-family:'Orbitron',sans-serif;background:rgba(124,92,255,.14);border:1px solid #7c5cff;color:#cfc4ff;cursor:pointer;transition:.18s}
.js-btn:hover{background:#7c5cff;color:#06121a}
.js-note{font-size:10.5px;color:var(--dim);line-height:1.5;letter-spacing:.05em}
#jarvisThink{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.28em;color:#b9a8ff;text-shadow:0 0 12px rgba(124,92,255,.8);opacity:0;transition:opacity .2s;pointer-events:none}
#jarvisThink.on{opacity:1}
</style>
</head>
<body>

<div id="boot"><div id="bootlog"></div></div>

<div id="app">
<header>
<div class="brand"><h1>J.A.R.V.I.S.</h1><small>JUST A RATHER VERY INTELLIGENT SYSTEM</small></div>
<div class="hdr-right">
<button class="chip" id="vmode" style="font-size:10px;padding:5px 10px;letter-spacing:.15em">ДЖАРВИС · RU</button>
<span><span class="dot"></span> ONLINE</span>
<span class="clock" id="clock">--:--:--</span>
</div>
</header>
<main>
<aside class="panel left">
<h2>СИСТЕМЫ <span id="sysstate">АНАЛИЗ</span></h2>
<div id="metrics"></div>
<h2 style="margin-top:18px">ТЕЛЕМЕТРИЯ <span id="telestatus">СБОР</span></h2>
<div id="tele"></div>
</aside>
<section class="center">
<div class="reactor-wrap"><canvas id="reactor"></canvas><div id="state">ОЖИДАНИЕ</div></div>
<div class="wave"><canvas id="wave"></canvas></div>
</section>
<aside class="panel right">
<h2>ЖУРНАЛ <span id="logcount">0</span></h2>
<div id="log"></div>
</aside>
</main>
<footer>
<div class="chips">
<button class="chip hot" id="paletteBtn">ВСЕ КОМАНДЫ (Ctrl+K)</button>
<button class="chip" data-cmd="полная диагностика">диагностика</button>
<button class="chip" data-cmd="который час">время</button>
<button class="chip" data-cmd="список программ">список программ</button>
<button class="chip" data-cmd="включи роблокс">включи роблокс</button>
<button class="chip" data-cmd="запусти дискорд">запусти дискорд</button>
<button class="chip" data-cmd="открой ютуб">открой ютуб</button>
<button class="chip" data-cmd="список браузеров">список браузеров</button>
</div>
<div class="inputrow">
<input id="cmd" type="text" autocomplete="off" spellcheck="false" placeholder="Скажите или введите что угодно, сэр...">
<button class="btn" id="mic"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg></button>
<button class="btn" id="sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 2.2v2.1a7.5 7.5 0 0 1 0 15.4v2.1a9.5 9.5 0 0 0 0-19.6z"/></svg></button>
<button class="btn" id="send">ОТПРАВИТЬ</button>
</div>
</footer>
</div>

<div id="palette" class="palette">
<div class="palette-box">
<div class="palette-head"><input id="paletteSearch" type="text" placeholder="Поиск команды..."><span class="palette-count" id="paletteCount">0</span></div>
<div class="palette-body"><aside id="paletteCats"></aside><div id="paletteList"></div></div>
<div class="palette-foot"><span>Enter — выполнить · ↑/↓ — навигация · Esc — закрыть</span><span>Ctrl+K</span></div>
</div>
</div>

<script>
'use strict';

/* ============ УТИЛИТЫ ============ */
function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function esc(s){return String(s==null?'—':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function copyText(t){try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(String(t));return true;}}catch(e){}return false;}
function requestFS(){try{var e=document.documentElement;if(e.requestFullscreen)e.requestFullscreen();else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();}catch(e){}}
function exitFS(){try{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();}catch(e){}}
function scrollIntoView(el,o){try{if(el&&el.scrollIntoView)el.scrollIntoView(o);}catch(e){}}

var mode='idle',level=0,soundOn=true,bootTime=performance.now();
var voiceMode='russian';try{voiceMode=localStorage.getItem('jarvisVoice')||'russian';}catch(e){}
var voiceRate=1,voicePitch=1;

/* ============ ТЕЛЕМЕТРИЯ ============ */
var SYS={ready:false,errors:[],browser:'—',browserVer:'—',os:'—',platform:'—',userAgent:'—',cores:'—',memory:'—',maxTouch:'—',gpu:'—',gpuVendor:'—',webglVer:'—',screen:'—',viewport:'—',colorDepth:'—',pixelRatio:'—',orientation:'—',online:'—',netType:'—',downlink:'—',rtt:'—',saveData:'—',batteryLevel:'—',batteryCharging:'—',batteryTime:'—',heapUsed:null,heapTotal:null,heapLimit:null,storageQuota:'—',storageUsage:'—',language:'—',languages:'—',timezone:'—',cookies:'—',dnt:'—',protocol:'—',fps:0,cpuLoad:0,pageLoadMs:0,batteryObj:null,connObj:null};

function detectBrowser(ua){if(/Edg\//.test(ua))return'Edge';if(/OPR\//.test(ua)||/Opera/.test(ua))return'Opera';if(/YaBrowser/.test(ua))return'Yandex';if(/Firefox\//.test(ua))return'Firefox';if(/Chrome\//.test(ua))return'Chrome';if(/Safari\//.test(ua)&&/Version\//.test(ua))return'Safari';if(/Trident|MSIE/.test(ua))return'IE';return'Unknown';}
function detectBrowserVer(ua){var m;if((m=ua.match(/Edg\/([\d.]+)/)))return m[1];if((m=ua.match(/OPR\/([\d.]+)/)))return m[1];if((m=ua.match(/YaBrowser\/([\d.]+)/)))return m[1];if((m=ua.match(/Firefox\/([\d.]+)/)))return m[1];if((m=ua.match(/Chrome\/([\d.]+)/)))return m[1];if((m=ua.match(/Version\/([\d.]+).*Safari/)))return m[1];return'—';}
function detectOS(ua){if(/Windows NT 10/.test(ua))return'Windows 10/11';if(/Windows NT 6\.3/.test(ua))return'Windows 8.1';if(/Windows NT 6\.1/.test(ua))return'Windows 7';if(/Windows/.test(ua))return'Windows';if(/Mac OS X ([\d_]+)/.test(ua))return'macOS '+ua.match(/Mac OS X ([\d_]+)/)[1].replace(/_/g,'.');if(/Android ([\d.]+)/.test(ua))return'Android '+ua.match(/Android ([\d.]+)/)[1];if(/iPhone|iPad|iPod/.test(ua))return'iOS';if(/Linux/.test(ua))return'Linux';return'Unknown';}

function detectStatic(){
  var ua=navigator.userAgent||'';
  SYS.userAgent=ua;SYS.browser=detectBrowser(ua);SYS.browserVer=detectBrowserVer(ua);SYS.os=detectOS(ua);SYS.platform=navigator.platform||'—';
  SYS.cores=(navigator.hardwareConcurrency||'—')+'';
  SYS.memory=navigator.deviceMemory?navigator.deviceMemory+' ГБ':'скрыто';
  SYS.maxTouch=(navigator.maxTouchPoints||0)+'';
  SYS.screen=screen.width+'×'+screen.height;SYS.viewport=window.innerWidth+'×'+window.innerHeight;
  SYS.colorDepth=screen.colorDepth+' бит';SYS.pixelRatio=(window.devicePixelRatio||1).toFixed(2);
  SYS.orientation=(screen.orientation&&screen.orientation.type)||'—';
  SYS.language=navigator.language||'—';
  SYS.languages=(navigator.languages&&navigator.languages.length)?navigator.languages.join(', '):(navigator.language||'—');
  try{SYS.timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||'—';}catch(e){SYS.timezone='—';}
  SYS.cookies=navigator.cookieEnabled?'да':'нет';
  SYS.dnt=(navigator.doNotTrack==='1'||navigator.doNotTrack==='yes')?'вкл':'выкл';
  SYS.protocol=(location.protocol==='https:')?'HTTPS':'HTTP';
  try{
    var cv=document.createElement('canvas');
    var gl=cv.getContext('webgl2')||cv.getContext('webgl')||cv.getContext('experimental-webgl');
    if(gl){
      SYS.webglVer=gl.getParameter(gl.VERSION)||'—';
      var dbg=gl.getExtension('WEBGL_debug_renderer_info');
      if(dbg){SYS.gpuVendor=gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL)||'—';SYS.gpu=gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)||'—';}
      else{SYS.gpuVendor=gl.getParameter(gl.VENDOR)||'—';SYS.gpu=gl.getParameter(gl.RENDERER)||'—';}
    }
  }catch(e){SYS.errors.push('WebGL: '+e.message);}
  if(performance&&performance.memory){
    SYS.heapUsed=Math.round(performance.memory.usedJSHeapSize/1048576);
    SYS.heapTotal=Math.round(performance.memory.totalJSHeapSize/1048576);
    SYS.heapLimit=Math.round(performance.memory.jsHeapSizeLimit/1048576);
  }
  SYS.online=navigator.onLine?'да':'нет';
  SYS.connObj=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  readConn();
  if(performance&&performance.timing){var t=performance.timing;SYS.pageLoadMs=t.loadEventEnd&&t.navigationStart?(t.loadEventEnd-t.navigationStart):0;}
  SYS.ready=true;
}

function lev(a,b){a=a.toLowerCase();b=b.toLowerCase();var m=a.length,n=b.length;if(!m)return n;if(!n)return m;var d=[];for(var i=0;i<=m;i++){d.push([i]);for(var j=1;j<=n;j++)d[i].push(0);}for(var k=0;k<=n;k++)d[0][k]=k;for(var ii=1;ii<=m;ii++)for(var jj=1;jj<=n;jj++)d[ii][jj]=Math.min(d[ii-1][jj]+1,d[ii][jj-1]+1,d[ii-1][jj-1]+(a[ii-1]===b[jj-1]?0:1));return d[m][n];}
function sim(a,b){var l=Math.max(a.length,b.length);return l?1-lev(a,b)/l:0;}

/* ============ ЦЕПОЧКИ / FALLBACK ============ */
function splitChain(text){var p=text.split(/\s+(?:и|затем|потом|а также)\s+(?=[а-яёa-z])/i);var o=[];for(var i=0;i<p.length;i++){var x=p[i].trim();if(x.length>2)o.push(x);}return o;}
function execCmd(cmd,m){try{return cmd.fn(m)||null;}catch(e){return R('Ошибка: '+e.message,'Error.');}}
function matchCommand(text){for(var i=0;i<CMDS.length;i++){if(CMDS[i].tabla)continue;if(!CMDS[i].re)continue;try{var m=text.match(CMDS[i].re);if(m)return{cmd:CMDS[i],m:m};}catch(e){}}return null;}

/* Fallback — открывает URL по системному браузеру через Go-мост */
function openUrl(url){
  if(typeof window.jarvisOpenBrowser==='function'){ window.jarvisOpenBrowser(url); }
  else { window.open(url,'_blank'); }
}

function smartFallback(text){
  var q=text.trim(),low=q.toLowerCase();
  if(/^https?:\/\//i.test(q)||/^[\w-]+\.(ru|com|org|net|io|dev|app|me|co)(\/|$)/i.test(q)){
    var u=/^https?:\/\//i.test(q)?q:('https://'+q);
    CTX.lastUrl=u;
    openUrl(u);
    return R('Открываю '+u,'Opening.');
  }
  if(/^[\w.+-]+@[\w-]+\.[a-z]{2,}$/i.test(q))return RA('Пишу на '+q,'Writing.',function(){openUrl('mailto:'+q);});
  if(/^\+?[\d\s\-()]{7,}$/.test(q)){var t=q.replace(/[^\d+]/g,'');return RA('Звоню '+q,'Dialing.',function(){openUrl('tel:'+t);});}
  if(/^[\d\s+\-*/^%().,a-zA-Z]+$/.test(q)&&/[0-9]/.test(q)){try{var v=evalMath(q);if(typeof v==='number'&&isFinite(v)){var r=Math.round(v*1e6)/1e6;return R('Ответ: '+r+'.','Answer: '+r);}}catch(e){}}
  if(/^(найди|поищи|загугли|найти|поиск|ищи|search|find|google)\b/i.test(low)){
    var term=low.replace(/^(найди|поищи|загугли|найти|поиск|ищи|search|find|google)\s*/i,'').trim();
    if(term){CTX.lastSearch=term;openUrl('https://www.google.com/search?q='+encodeURIComponent(term));return R('Ищу «'+term+'».','Searching.');}
  }
  if(q.length<4)return R('Слушаю вас, сэр.','I am listening, sir.');
  return R('Не распознал, сэр. Попробуйте: «включи роблокс», «запусти дискорд», «открой ютуб», «который час», «помощь».','Did not recognise, sir.');
}

/* ============ ГЛАВНЫЙ ОБРАБОТЧИК ============ */
function handleCommand(raw){
  var text=String(raw||'').trim();if(!text)return;
  addLog('user',text);setMode('thinking');blip(520);
  setTimeout(function(){
    var direct=resolveKB(text);
    if(direct){var useEn=(voiceMode==='authentic');var spoken=(useEn&&direct.en)?direct.en:(direct.ru||direct.en||'');addLog('jarvis',spoken);speak(spoken);if(!soundOn)setMode('idle');setTimeout(function(){if(mode==='speaking'&&!speechSynthesis.speaking)setMode('idle');},400);return;}
    var parts=splitChain(text),results=[],actionQueue=[],i;
    for(i=0;i<parts.length;i++){
      var part=parts[i],lower=part.toLowerCase();
      var match=matchCommand(lower);
      var reply=match?execCmd(match.cmd,match.m):null;
      if(!reply)reply=smartFallback(part);
      if(reply){if(typeof reply==='string')results.push(reply);else{var useEn2=(voiceMode==='authentic');var spoken2=(useEn2&&reply.en)?reply.en:(reply.ru||reply.en||'');if(spoken2)results.push(spoken2);if(reply.action)actionQueue.push(reply.action);}}
    }
    if(!results.length){var fb=smartFallback(text);if(typeof fb==='string')results.push(fb);else{var useEn3=(voiceMode==='authentic');results.push((useEn3&&fb.en)?fb.en:fb.ru);if(fb.action)actionQueue.push(fb.action);}}
    for(i=0;i<actionQueue.length;i++){try{actionQueue[i]();}catch(e){}}
    var full=results.join(' ');addLog('jarvis',full);speak(full);
    if(!soundOn)setMode('idle');
    setTimeout(function(){if(mode==='speaking'&&!speechSynthesis.speaking)setMode('idle');},400);
  },380);
}

var paletteOpenFlag=false,paletteSel=0,paletteFiltered=[],activeCat='Все',paletteDebounce=null;
function paletteOpen(){paletteOpenFlag=true;$('#palette').classList.add('on');$('#paletteSearch').value='';paletteSel=0;renderPalette('');setTimeout(function(){try{$('#paletteSearch').focus();}catch(e){}},100);}
function paletteClose(){paletteOpenFlag=false;$('#palette').classList.remove('on');}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
function renderCats(){
  var cats=['Все'],seen={'Все':1},i;
  for(i=0;i<CMDS.length;i++)if(!seen[CMDS[i].cat]){seen[CMDS[i].cat]=1;cats.push(CMDS[i].cat);}
  var html='';
  for(i=0;i<cats.length;i++){var c=cats[i],n=0;if(c==='Все')n=CMDS.length;else for(var j=0;j<CMDS.length;j++)if(CMDS[j].cat===c)n++;
    html+='<div class="cat '+(c===activeCat?'on':'')+'" data-cat="'+escapeHtml(c)+'"><span>'+escapeHtml(c)+'</span><span>'+n+'</span></div>';}
  $('#paletteCats').innerHTML=html;
  var els=$$('#paletteCats .cat');
  for(i=0;i<els.length;i++){els[i].onclick=(function(cn){return function(){activeCat=cn;renderCats();renderPalette($('#paletteSearch').value);};})(els[i].dataset.cat);}
}
function renderPalette(filter){
  var f=(filter||'').toLowerCase().trim();paletteFiltered=[];
  for(var i=0;i<CMDS.length;i++){
    var c=CMDS[i];
    if(activeCat!=='Все'&&c.cat!==activeCat)continue;
    if(f&&(c.name+' '+c.desc+' '+c.cat).toLowerCase().indexOf(f)<0)continue;
    paletteFiltered.push(c);
    if(paletteFiltered.length>=300)break;
  }
  if(paletteSel>=paletteFiltered.length)paletteSel=0;
  $('#paletteCount').textContent=paletteFiltered.length+' / '+CMDS.length;
  var html='';
  for(var j=0;j<paletteFiltered.length;j++){var c2=paletteFiltered[j];
    html+='<div class="cmd-item '+(j===paletteSel?'sel':'')+'" data-idx="'+j+'"><div><div class="ci-name">'+escapeHtml(c2.name)+'</div><div class="ci-desc">'+escapeHtml(c2.desc)+'</div></div><div class="ci-cat">'+escapeHtml(c2.cat)+'</div></div>';}
  $('#paletteList').innerHTML=html;
  var items=$$('#paletteList .cmd-item');
  for(var k=0;k<items.length;k++){items[k].onclick=(function(idx){return function(){var c=paletteFiltered[idx];if(!c)return;paletteClose();runFromPalette(c);};})(parseInt(items[k].dataset.idx,10));}
}
function runFromPalette(cmd){
  addLog('user',cmd.name);setMode('thinking');blip(520);
  setTimeout(function(){
    var reply=null;
    try{
      if(cmd.tabla){reply={ru:cmd.name+' = '+cmd.desc,en:cmd.name+' = '+cmd.desc,action:null};}
      else{
        var fake={input:cmd.name.toLowerCase(),groups:[],length:1,index:0};
        try{reply=cmd.fn(fake);}catch(e){reply=null;}
        if(!reply&&cmd.re){try{var m=cmd.name.toLowerCase().match(cmd.re);if(m)reply=cmd.fn(m);}catch(e){}}
        if(!reply)reply=R('Команда «'+cmd.name+'» требует данных.','Command needs arguments.');
      }
    }catch(e){reply=R('Ошибка.','Error.');}
    var results=[],actions=[];
    if(typeof reply==='string')results.push(reply);
    else if(reply){var useEn=(voiceMode==='authentic');var spoken=(useEn&&reply.en)?reply.en:(reply.ru||reply.en||'');if(spoken)results.push(spoken);if(reply.action)actions.push(reply.action);}
    for(var k=0;k<actions.length;k++){try{actions[k]();}catch(e){}}
    var full=results.join(' ');
    if(full){addLog('jarvis',full);speak(full);}
    if(!soundOn)setMode('idle');
    setTimeout(function(){if(mode==='speaking'&&!speechSynthesis.speaking)setMode('idle');},400);
  },200);
}

var palSearch=$('#paletteSearch');
if(palSearch){
  palSearch.addEventListener('input',function(e){clearTimeout(paletteDebounce);var v=e.target.value;paletteDebounce=setTimeout(function(){paletteSel=0;renderPalette(v);},120);});
  palSearch.addEventListener('keydown',function(e){
    if(e.key==='Escape')paletteClose();
    else if(e.key==='ArrowDown'){e.preventDefault();paletteSel=Math.min(paletteFiltered.length-1,paletteSel+1);renderPalette(palSearch.value);var it=$$('#paletteList .cmd-item');if(it[paletteSel])scrollIntoView(it[paletteSel],{block:'nearest'});}
    else if(e.key==='ArrowUp'){e.preventDefault();paletteSel=Math.max(0,paletteSel-1);renderPalette(palSearch.value);var it2=$$('#paletteList .cmd-item');if(it2[paletteSel])scrollIntoView(it2[paletteSel],{block:'nearest'});}
    else if(e.key==='Enter'){e.preventDefault();var c=paletteFiltered[paletteSel];if(c){paletteClose();runFromPalette(c);}}
  });
}

  C(cat,name,desc,NEVER_RE(),(function(ruA,enA,act){

}

(function(){
  'use strict';

  var SHORTCUTS = {};
  var BROWSERS = [];
  var RU_TO_EN = {
    'роблокс':'roblox','роблокс студио':'roblox','дискорд':'discord','дис':'discord',
    'спотифай':'spotify','спотик':'spotify','телеграм':'telegram','телега':'telegram','тг':'telegram',
    'хром':'chrome','гугл хром':'chrome','браузер':'chrome','ютуб':'youtube','ютюб':'youtube',
    'яндекс музыка':'yandex_music','яндексмузыка':'yandex_music','зона':'zona','зону':'zona',
    'фейсит':'faceit_ac','евро трек':'euro_truck','евро трекер':'euro_truck','евротрек':'euro_truck',
    'етс':'euro_truck','етс2':'euro_truck','стим':'steam','прокси':'proxy'
  };

  function hasGoBridge(){
    return typeof window.jarvisRun === 'function';
  }

  function normalizeName(name){
    var n = String(name).toLowerCase().trim().replace(/[.!?]/g,'');
    if (RU_TO_EN[n]) return RU_TO_EN[n];
    var norm = n.replace(/\s+/g,'_');
    if (RU_TO_EN[norm]) return RU_TO_EN[norm];
    return norm;
  }

  function openTarget(name, target){
    if (hasGoBridge()){
      var res = window.jarvisRun(name);
      addLog('sys', res);
      return;
    }
    if (!target){ addLog('sys','❌ Нет пути для ' + name); return; }
    try{
      var w = window.open(target, '_blank');
      if (!w) window.location.href = target;
      addLog('sys', '✅ Открыто: ' + name + '\n    → ' + target);
    }catch(e){ addLog('sys','❌ ' + e.message); }
  }

  /* ============================================================
     БРАУЗЕРЫ
     ============================================================ */
  function loadBrowsers(){
    fetch('/api/browsers')
      .then(function(r){ return r.json(); })
      .then(function(data){
        BROWSERS = (data && data.browsers) || [];
        console.log('%c[JARVIS] Браузеров найдено: ' + BROWSERS.length, 'color:#42ffb0');
        for (var i = 0; i < BROWSERS.length; i++){
          console.log('%c[JARVIS] ' + BROWSERS[i].name + ': ' + BROWSERS[i].path, 'color:#38e8ff');
        }
        buildBrowserCommands();
      })
      .catch(function(e){ console.warn('[JARVIS] Не удалось получить список браузеров:', e); });
  }

  function findBrowser(name){
    var q = String(name).toLowerCase().trim();
    var aliases = {
      'хром':'chrome','гугл':'chrome','гугл хром':'chrome','chrome':'chrome',
      'эдж':'edge','edge':'edge','край':'edge',
      'фаерфокс':'firefox','firefox':'firefox','мозила':'firefox','mozilla':'firefox',
      'опера':'opera','opera':'opera',
      'яндекс':'yandex','яндекс браузер':'yandex','yandex':'yandex',
      'brave':'brave','брейв':'brave',
      'vivaldi':'vivaldi','вивальди':'vivaldi'
    };
    var target = aliases[q] || q;
    for (var i = 0; i < BROWSERS.length; i++){
      if (BROWSERS[i].name.toLowerCase() === target) return BROWSERS[i];
    }
    return null;
  }

  function openInBrowserByName(browserName, url){
    var b = findBrowser(browserName);
    if (!b){
      var list = BROWSERS.map(function(x){ return x.name; }).join(', ');
      addLog('sys', '❌ Не нашёл браузер «' + browserName + '». Доступные: ' + list);
      return;
    }
    if (hasGoBridge() && typeof window.jarvisOpenIn === 'function'){
      var res = window.jarvisOpenIn(b.path, url);
      addLog('sys', res);
    } else {
      window.open(url, '_blank');
    }
  }

  function buildBrowserCommands(){
    for (var i = 0; i < BROWSERS.length; i++){
      (function(b){
        CMDS.unshift({
          cat: 'Браузеры',
          name: '🌐 Открыть в ' + b.name,
          desc: 'Запустить ' + b.name + ' и открыть Google',
          re: NEVER_RE(),
          fn: function(){
            if (hasGoBridge() && typeof window.jarvisOpenIn === 'function'){
              window.jarvisOpenIn(b.path, 'https://www.google.com');
              addLog('sys', '✅ ' + b.name + ' запущен');
            }
            return R('Открываю ' + b.name + '.', 'Opening ' + b.name + '.');
          }
        });
      })(BROWSERS[i]);
    }
    if (typeof renderCats === 'function') renderCats();
  }

  /* Голосовая команда: "открой ютуб в chrome" */
  CMDS.unshift({
    cat: 'Браузеры',
    name: '🌐 Открыть в конкретном браузере',
    desc: 'открой <сайт> в <браузер>',
    re: /^(?:открой|запусти|включи)\s+(\S+)\s+в\s+(.+)$/i,
    fn: function(m){
      var url = m[1].trim();
      var browser = m[2].trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      openInBrowserByName(browser, url);
      return R('Открываю ' + url + ' в ' + browser + '.', 'Opening in ' + browser + '.');
    }
  });

  /* Сменить браузер по умолчанию */
  CMDS.unshift({
    cat: 'Браузеры',
    name: '🌐 Сменить браузер по умолчанию',
    desc: 'Открыть настройки Windows',
    re: /^(?:смени браузер|сменить браузер|браузер по умолчанию|поменяй браузер)/i,
    fn: function(){
      if (hasGoBridge() && typeof window.jarvisOpen === 'function'){
        window.jarvisOpen('ms-settings:defaultapps');
      } else {
        try { window.location.href = 'ms-settings:defaultapps'; } catch(e){}
      }
      return R('Открываю настройки. Выберите браузер → «По умолчанию».',
               'Opening Windows Settings.');
    }
  });

  /* Список браузеров */
  CMDS.unshift({
    cat: 'Браузеры',
    name: '🌐 Список браузеров',
    desc: 'Какие браузеры найдены',
    re: /^(?:список браузеров|какие браузеры|мои браузеры|браузеры)/i,
    fn: function(){
      if (!BROWSERS.length) return R('Браузеры ещё не найдены.', 'Loading...');
      var list = BROWSERS.map(function(b){ return b.name; }).join(', ');
      addLog('sys', '🌐 Установленные браузеры: ' + list);
      return R('Найдено ' + BROWSERS.length + ': ' + list, BROWSERS.length + ' browsers.');
    }
  });

  /* ============================================================
     ЯРЛЫКИ ПРОГРАММ
     ============================================================ */
  function loadShortcuts(){
    fetch('shortcuts.json?' + Date.now())
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(map){
        SHORTCUTS = map || {};
        var names = Object.keys(SHORTCUTS);
        console.log('%c[JARVIS LAUNCHER] Загружено: ' + names.length, 'color:#42ffb0');
        console.log('%c[JARVIS LAUNCHER] ' + names.join(', '), 'color:#38e8ff');
        buildShortcutCommands(names);
      })
      .catch(function(e){
        console.warn('[JARVIS LAUNCHER] shortcuts.json не загружен:', e);
      });
  }

  function buildShortcutCommands(names){
    for (var r = CMDS.length - 1; r >= 0; r--){
      if (CMDS[r].name && CMDS[r].name.indexOf('▶ ') === 0 &&
          CMDS[r].name.indexOf('▶ Запустить приложение') !== 0 &&
          CMDS[r].name.indexOf('▶ Список программ') !== 0 &&
          CMDS[r].name.indexOf('▶ Обновить ярлыки') !== 0){
        CMDS.splice(r, 1);
      }
    }
    var newCmds = [];
    for (var i = 0; i < names.length; i++){
      (function(name){
        newCmds.push({
          cat: 'Запуск',
          name: '▶ ' + name,
          desc: 'Открыть ' + name,
          re: NEVER_RE(),
          fn: function(){
            openTarget(name, SHORTCUTS[name]);
            return R('Запускаю ' + name + '.', 'Launching ' + name + '.');
          }
        });
      })(names[i]);
    }
    for (var k = newCmds.length - 1; k >= 0; k--) CMDS.unshift(newCmds[k]);
    if (typeof renderCats === 'function') renderCats();
  }

  /* Команда запуска (ПЕРВОЙ) */
  CMDS.unshift({
    cat: 'Запуск',
    name: '▶ Запустить приложение',
    desc: 'включи/запусти/открой <имя>',
    re: /^(?:запусти|включи|вруби|открой|старт|загрузи|играй в|запустить|включить|открыть)\s+(.+)$/i,
    fn: function(m){
      var raw = m[1].trim();
      var name = normalizeName(raw);
      var keys = Object.keys(SHORTCUTS);
      if (!keys.length && !hasGoBridge()) return R('Ярлыки ещё не загружены.','Shortcuts not loaded.');
      if (SHORTCUTS[name]){ openTarget(name, SHORTCUTS[name]); return R('Запускаю ' + name + '.', 'Launching ' + name + '.'); }
      for (var i = 0; i < keys.length; i++){
        var k = keys[i];
        if (k.indexOf(name) >= 0 || name.indexOf(k) >= 0){
          openTarget(k, SHORTCUTS[k]);
          return R('Запускаю ' + k + '.', 'Launching ' + k + '.');
        }
      }
      var best = null, bs = 0;
      for (var j = 0; j < keys.length; j++){
        var sc = sim(name, keys[j].toLowerCase());
        if (sc > bs && sc > 0.55){ bs = sc; best = keys[j]; }
      }
      if (best){ openTarget(best, SHORTCUTS[best]); return R('Запускаю ' + best + '.', 'Launching ' + best + '.'); }
      if (hasGoBridge()){
        var res = window.jarvisRun(name);
        return R(res, res);
      }
      return R('Не нашёл «' + raw + '». Скажите «список программ».', 'Unknown "' + raw + '".');
    }
  });

  /* Список программ */
  CMDS.unshift({
    cat: 'Запуск',
    name: '▶ Список программ',
    desc: 'Все доступные ярлыки',
    re: /^(?:список программ|какие программы|что можно запустить|список игр|мои игры|список приложений)/i,
    fn: function(){
      if (hasGoBridge() && typeof window.jarvisList === 'function'){
        var s = window.jarvisList();
        addLog('sys', s);
        return R(s, s);
      }
      var keys = Object.keys(SHORTCUTS);
      if (!keys.length) return R('Список пуст.','Empty.');
      addLog('sys', '📋 Доступно: ' + keys.length + '\n' + keys.join(' · '));
      return R('Доступно ' + keys.length + ' программ, сэр.', keys.length + ' apps available.');
    }
  });

  /* Обновить ярлыки */
  CMDS.unshift({
    cat: 'Запуск',
    name: '▶ Обновить ярлыки',
    desc: 'Перечитать shortcuts.json',
    re: /^(?:обнови ярлыки|перечитай ярлыки|reload shortcuts)/i,
    fn: function(){
      if (hasGoBridge() && typeof window.jarvisReload === 'function'){
        var res = window.jarvisReload();
        addLog('sys', res);
      }
      loadShortcuts();
      return R('Обновляю.','Reloading.');
    }
  });

  /* Открыть файл по пути */
  CMDS.unshift({
    cat: 'Запуск',
    name: '▶ Открыть файл по пути',
    desc: 'открой файл <путь>',
    re: /^(?:открой файл|открой путь)\s+(.+)$/i,
    fn: function(m){
      var path = m[1].trim();
      if (hasGoBridge() && typeof window.jarvisOpen === 'function'){
        var res = window.jarvisOpen(path);
        addLog('sys', res);
        return R('Открываю ' + path, 'Opening.');
      }
      return RA('Открываю.', 'Opening.', function(){
        window.open('file:///' + path.replace(/\\/g,'/'), '_blank');
      });
    }
  });

  /* Открыть в браузере */
  CMDS.unshift({
    cat: 'Запуск',
    name: '▶ Открыть в браузере',
    desc: 'открой в браузере <url>',
    re: /^(?:открой в браузере|открой в хроме)\s+(.+)$/i,
    fn: function(m){
      var url = m[1].trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      if (hasGoBridge() && typeof window.jarvisOpenBrowser === 'function'){
        window.jarvisOpenBrowser(url);
      } else {
        window.open(url, '_blank');
      }
      return R('Открываю в браузере.','Opening in browser.');
    }
  });

  loadShortcuts();
  loadBrowsers();

  console.log('%c[JARVIS] Режим: ' + (hasGoBridge() ? 'Go (нативный)' : 'Браузер'),
              'color:#42ffb0;font-weight:bold');
})();

    fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
     .then(function(r){return r.json();})
     .then(function(j){note(j.ok?'сохранено ✓':'ошибка');if(j.ok){try{localStorage.setItem('jarvisVoice',body.voice);}catch(e){}}})
     .catch(function(e){note('ошибка: '+e);});
  }
  function loadModels(){
    note('загружаю…');
    fetch('/api/models').then(function(r){return r.json();}).then(function(j){
      var dl=document.getElementById('jsModelList');dl.innerHTML='';
      (j.models||[]).forEach(function(m){var o=document.createElement('option');o.value=m;dl.appendChild(o);});
      note('моделей: '+((j.models||[]).length||0)+((j.models&&j.models.length)?(' — '+j.models.join(', ').slice(0,180)):''));
    }).catch(function(e){note('ошибка: '+e);});
  }
  function testApi(){
    note('проверяю…');
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:[{role:'user',content:'Ответь одним словом: работаешь?'}]})})
     .then(function(r){return r.json();})
     .then(function(j){note(j.ok?('связь ✓ — '+String(j.content).slice(0,90)):('ошибка: '+j.error));})
     .catch(function(e){note('ошибка: '+e);});
  }
  
  /* ---- кнопка-индикатор в шапке ---- */
  function markChip(){
    var b=document.getElementById('aiChip');if(!b)return;
    b.classList.toggle('jarvis-ai-chip',AI.on);
    b.textContent=AI.on?'ИИ МОЗГ · ON':'ИИ: ВЫКЛ';
    if(typeof speak==='function'){try{AI.cfg.voice&&localStorage.setItem('jarvisVoice',AI.cfg.voice);}catch(e){}}
  }
  function ensureChip(){
    if(document.getElementById('aiChip'))return;
    var host=document.querySelector('.hdr-right')||document.querySelector('header');
    if(!host)return;
    var b=document.createElement('button');
    b.className='chip';b.id='aiChip';b.textContent='ИИ: ВЫКЛ';
    b.style.cursor='pointer';
    b.onclick=function(){
      if(AI.on){AI.on=false;markChip();note('ИИ-режим выключен');}
      else{openSettings();}
    };
    host.insertBefore(b,host.firstChild);
    markChip();
  }
  
  /* ---- выполнение меток действий ---- */
  function runActions(text){
    var re=/\[\[(OPEN|RUN|SEARCH)\s*:\s*([^\]]+)\]\]/gi,m,found=false;
    while((m=re.exec(text))!==null){
      found=true;
      var kind=m[1].toUpperCase(), val=m[2].trim();
      if(kind==='RUN'){
        if(typeof jarvisRun==='function'){ var r=jarvisRun(val); log2('jarvis',r); say(r); }
        else{ postOpen({name:val}); }
      } else if(kind==='OPEN'){
        if(typeof jarvisOpen==='function'){ jarvisOpen(val); say('Открываю, сэр.'); }
        else{ postOpen({target:val}); }
      } else {
        var u='https://www.google.com/search?q='+encodeURIComponent(val);
        if(typeof jarvisOpen==='function'){ jarvisOpen(u); say('Ищу в интернете.'); }
        else{ postOpen({target:u}); }
      }
    }
    return found;
  }
  function postOpen(payload){
    fetch('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
     .then(function(r){return r.json();})
     .then(function(j){ log2('jarvis', j.ok?('✅ '+payload.name||payload.target):('❌ '+(j.error||'ошибка'))); })
     .catch(function(e){ log2('jarvis','❌ '+e); });
  }
  function clean(text){
    return String(text||'').replace(/\[\[(OPEN|RUN|SEARCH)[^\]]*\]\]/gi,'').replace(/\n{3,}/g,'\n\n').trim();
  }
  
  /* ---- запрос к ИИ ---- */
  function askAI(text){
    if(!text)return Promise.resolve('');
    AI.busy=true;
    var th=document.getElementById('jarvisThink');
    if(th)th.classList.add('on');
    setState('thinking');
    AI.history.push({role:'user',content:text});
    if(AI.history.length>20)AI.history.splice(0,2);
  
    return fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:AI.history})})
      .then(function(r){return r.json();})
      .then(function(j){
        AI.busy=false;
        if(th)th.classList.remove('on');
        if(!j.ok){
          log2('sys','[ИИ] '+(j.error||'ошибка'));
          var friendly='Не удалось связаться с ИИ, сэр. Проверьте ключ и адрес в настройках ИИ-мозга.';
          log2('jarvis',friendly); say(friendly);
          setState('idle');
          return '';
        }
        var full=j.content||'';
        var cleanText=clean(full);
        AI.history.push({role:'assistant',content:full});
        log2('jarvis',cleanText);
        setState('speaking');
        say(cleanText);
        var did=runActions(full);
        if(!did) setTimeout(function(){ if(!AI.busy) setState('idle'); },1500);
        return cleanText;
      })
      .catch(function(e){
        AI.busy=false;
        if(th)th.classList.remove('on');
        log2('sys','[ИИ] '+e);
        setState('idle');
        return '';
      });
  }
  
  /* ---- ПЕРЕХВАТ ВСЕХ ЗАПРОСОВ ---- */
  var orig = (typeof handleCommand==='function') ? handleCommand : null;
  window.handleCommand = function(text){
    text=String(text==null?'':text).trim();
    if(!text)return;
    if(AI.on && !AI.busy){
      log2('user',text);
      askAI(text);
      return;
    }
    if(orig){ return orig(text); }
  };
  
  setTimeout(function(){
    ensureChip(); buildUI();
    fetch('/api/status').then(function(r){return r.json();}).then(function(j){
      if(j && j.ai){ AI.on=true; markChip(); }
      log2('sys','ИИ-модуль '+(j&&j.ai?'готов ✓':'без ключа — нажми «ИИ: ВЫКЛ» в шапке'));
    }).catch(function(){});
  },900);
  
  /* ---- горячая клавиша Ctrl+Shift+I ---- */
  document.addEventListener('keydown',function(e){
    if(e.ctrlKey && e.shiftKey && (e.key==='I'||e.key==='и')){e.preventDefault();AI.on?openSettings():(AI.on=true,markChip(),openSettings());}
  });
  })();
  </script>
  <script>
    /* ==================== JARVIS: КОМАНДНЫЙ ДВИЖОК ==================== */
    (function(){
    'use strict';
    if(window.__jarvisCmd){return;} window.__jarvisCmd=true;
    
    var CATALOG=[];           /* [{name,args,desc,cat}] */
    var MODE='cmd';           /* 'cmd' | 'text' */
    var BUSY=false;
    
    /* ---------- работа с Go через биндинг, иначе через HTTP ---------- */
    function callGo(payload){
      return new Promise(function(resolve){
        var done=false;
        function viaBind(){
          try{
            if(typeof jarvisExec==='function'){
              var r=jarvisExec(JSON.stringify(payload));
              done=true; resolve(JSON.parse(r)); return true;
            }
          }catch(e){}
          return false;
        }
        if(viaBind())return;
        fetch('/api/exec?p='+encodeURIComponent(JSON.stringify(payload)))
          .then(function(r){return r.json();})
          .then(resolve)
          .catch(function(e){resolve({ok:false,msg:'ошибка связи с ядром: '+e});});
        setTimeout(function(){ if(!done){} },50);
      });
    }
    
    /* ---------- логика выполнения ---------- */
    function addLog2(who,txt){
      try{ if(typeof addLog==='function'){addLog(who,txt);} }catch(e){}
    }
    function say2(txt){ try{ if(typeof speak==='function'){speak(txt);} }catch(e){} }
    function state2(s){ try{ if(typeof setMode==='function'){setMode(s);} }catch(e){} }
    
    function runCmd(line){
      line=String(line||'').trim();
      if(!line)return;
      if(line==='help'||line==='помощь'||line==='?'){line='help';}
      var parts=line.split(/\s+/);
      var name=parts[0].toLowerCase();
      var rest=line.slice(name.length).trim();
      BUSY=true; state2('thinking');
      callGo({cmd:name,arg:rest}).then(function(r){
        BUSY=false;
        if(!r){state2('idle');return;}
        if(r.ok){ addLog2('jarvis', r.msg||'готово'); }
        else{ addLog2('sys','⚠ '+r.msg); }
        say2(r.ok? shortSpeak(r.msg) : 'Ошибка: '+r.msg);
        state2('idle');
      });
    }
    
    function shortSpeak(msg){
      var m=String(msg||'').split('\n')[0];
      if(m.length>120)m=m.slice(0,120)+'...';
      return m;
    }
    
    /* ---------- перехват ввода ---------- */
    var origCmd=(typeof handleCommand==='function')?handleCommand:null;
    window.handleCommand=function(text){
      text=String(text==null?'':text).trim();
      if(!text)return;
      addLog2('user',text);
      runCmd(text);
    };
    
    /* ---------- загрузка каталога команд ---------- */
    function loadCatalog(){
      fetch('/api/commands').then(function(r){return r.json();}).then(function(list){
        if(!list||!list.length)return;
        CATALOG=list;
        buildPalette();
      }).catch(function(e){addLog2('sys','каталог команд недоступен: '+e);});
    }
    
    function buildPalette(){
      var host=document.getElementById('paletteList');
      var cats=document.getElementById('paletteCats');
      if(!host)return;
      var byCat={};
      CATALOG.forEach(function(c){ (byCat[c.cat]=byCat[c.cat]||[]).push(c); });
    
      if(cats&&!cats.dataset.built){
        cats.dataset.built='1';
        cats.innerHTML='';
        var all=document.createElement('div');
        all.className='cat on'; all.dataset.cat='';
        all.innerHTML='<b>ВСЕ</b><span>'+CATALOG.length+'</span>';
        all.onclick=function(){ selectCat(cats,host,''); };
        cats.appendChild(all);
        Object.keys(byCat).sort().forEach(function(k){
          var d=document.createElement('div');
          d.className='cat'; d.dataset.cat=k;
          d.innerHTML='<b>'+k.toUpperCase()+'</b><span>'+byCat[k].length+'</span>';
          d.onclick=function(){ selectCat(cats,host,k); };
          cats.appendChild(d);
        });
      }
    
      host.innerHTML='';
      var all=[];
      Object.keys(byCat).forEach(function(k){ all=all.concat(byCat[k]); });
      renderItems(host,all);
    }
    
    function selectCat(cats,host,cat){
      Array.prototype.forEach.call(cats.children,function(el){
        el.classList.toggle('on', (el.dataset.cat||'')===cat);
      });
      var byCat={};
      CATALOG.forEach(function(c){ (byCat[c.cat]=byCat[c.cat]||[]).push(c); });
      renderItems(host, cat? (byCat[cat]||[]) : CATALOG.slice());
    }
    
    function renderItems(host,list){
      host.innerHTML='';
      list.forEach(function(c){
        var d=document.createElement('div');
        d.className='cmd-item'; d.dataset.name=c.name; d.dataset.args=c.args||'';
        d.innerHTML='<div><div class="ci-name">'+c.name+(c.args?' <span style="opacity:.6">'+c.args+'</span>':'')+
                   '</div><div class="ci-desc">'+c.desc+'</div></div>'+
                   '<div class="ci-cat">'+c.cat+'</div>';
        d.onclick=function(){ fillCmd(c); };
        host.appendChild(d);
      });
    }
    
    function fillCmd(c){
      var inp=document.getElementById('cmd');
      if(inp){ inp.value=c.name+(c.args?' ':''); inp.focus();
               inp.dataset.argmode=c.args?'1':''; }
      var p=document.getElementById('palette');
      if(p)p.classList.remove('on');
    }
    
    /* ---------- поиск в палитре ---------- */
    var origSearch=null;
    document.addEventListener('DOMContentLoaded',function(){
      var s=document.getElementById('paletteSearch');
      if(s){
        s.addEventListener('input',function(){
          var q=s.value.toLowerCase().trim();
          var list=CATALOG.filter(function(c){
            return !q||c.name.indexOf(q)>=0||c.desc.toLowerCase().indexOf(q)>=0||c.cat.toLowerCase().indexOf(q)>=0;
          });
          renderItems(document.getElementById('paletteList'),list);
          var cnt=document.getElementById('paletteCount');
          if(cnt)cnt.textContent=list.length;
        });
      }
    });
    
    /* ---------- горячие клавиши ---------- */
    document.addEventListener('keydown',function(e){
      if((e.ctrlKey||e.metaKey)&&e.key==='k'){ e.preventDefault(); openPalette(); }
      if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='l'){ e.preventDefault(); runCmd('sysinfo'); }
    });
    function openPalette(){
      var p=document.getElementById('palette');
      if(!p)return;
      p.classList.add('on');
      var s=document.getElementById('paletteSearch');
      if(s){ s.value=''; s.focus(); }
    }
    
    setTimeout(function(){
      loadCatalog();
      var el=document.getElementById('paletteBtn');
      if(el)el.textContent='ВСЕ КОМАНДЫ ('+CATALOG.length+') · Ctrl+K';
      addLog2('sys','Командный модуль готов. Введите help — список команд. Примеры: sysinfo, ps chrome, killproc chrome, vol 30, openurl ya.ru, run roblox');
    },700);
    })();
    </script>
